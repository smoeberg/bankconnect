name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Syntax check all PHP files
        run: find htdocs/custom/bankconnect -name '*.php' -print0 | xargs -0 -n1 php -l

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install PHPUnit
        run: |
          wget -q https://phar.phpunit.de/phpunit-10.phar -O phpunit.phar
          php phpunit.phar --version
      - name: Run unit tests
        run: php phpunit.phar --bootstrap tests/unit/bootstrap.php tests/unit
