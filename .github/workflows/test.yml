name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Syntax check all PHP files
        run: find htdocs/custom/bankconnect -name '*.php' -print0 | xargs -0 -n1 php -l

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install PHPUnit
        run: |
          wget -q https://phar.phpunit.de/phpunit-10.phar -O phpunit.phar
          php phpunit.phar --version
      - name: Run unit tests
        run: php phpunit.phar --bootstrap tests/unit/bootstrap.php tests/unit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable module
        run: |
          bash scripts/build-module-package.sh
          package=$(find dist -maxdepth 1 -name 'module_bankconnect-*.zip' -print -quit)
          test -n "$package"
          unzip -Z1 "$package" | grep -Fx 'bankconnect/core/modules/modBankConnect.class.php'
          unzip -Z1 "$package" | grep -Fx 'bankconnect/class/PaymentPageService.php'
          unzip -Z1 "$package" | grep -Fx 'bankconnect/pages/payments.php'
